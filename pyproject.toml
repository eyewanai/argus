[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eyewan", email = "eyewan@tinyscope.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "dnspython>=2.8.0",
    "langgraph>=1.2.4",
    "openai>=2.41.0",
    "pydantic>=2.11.7",
    "python-whois>=0.9.6",
    "rich>=15.0.0",
    "ruff>=0.15.16",
    "whoisit>=4.0.4",
]

[project.scripts]
argus = "argus.app.main:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "argus",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["argus"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
]
